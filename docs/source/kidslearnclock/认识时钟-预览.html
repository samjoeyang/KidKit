<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>认识时钟 🍭 糖果时间乐园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --pink: #ffd6ec;
  --pink-deep: #ff6fa5;
  --lavender: #e6d9ff;
  --grape: #b497f5;
  --sky: #8fd8ff;
  --mint: #79e6bd;
  --sun: #ffe066;
  --sun-deep: #ffb703;
  --plum: #4a2e5c;
  --plum-soft: #7a5c94;
  --white: #ffffff;
  --shadow: rgba(122, 71, 148, 0.25);
  font-family: "Nunito", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  overscroll-behavior: none;
}

body {
  background: linear-gradient(160deg, var(--pink) 0%, var(--lavender) 45%, var(--sky) 100%);
  color: var(--plum);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  touch-action: pan-y;
}

#app {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px 16px 48px;
  z-index: 1;
}

/* ---------- 飘浮装饰 ---------- */
.deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.85;
  animation: float 7s ease-in-out infinite;
  filter: drop-shadow(0 6px 10px rgba(122,71,148,0.15));
}
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-16px) rotate(6deg); }
}
.deco.slow { animation-duration: 10s; }
.deco.rev { animation-direction: reverse; }

/* ---------- 标题 ---------- */
.title {
  font-family: "Baloo 2", sans-serif;
  font-weight: 800;
  font-size: clamp(26px, 6vw, 40px);
  color: var(--pink-deep);
  text-shadow: 3px 3px 0 var(--white), 0 6px 14px var(--shadow);
  text-align: center;
  margin: 6px 0 4px;
  letter-spacing: 1px;
}
.subtitle {
  font-weight: 700;
  color: var(--plum-soft);
  text-align: center;
  margin-bottom: 18px;
  font-size: clamp(13px, 3vw, 16px);
}

/* ---------- 模式切换 ---------- */
.mode-switch {
  display: flex;
  gap: 8px;
  background: var(--white);
  padding: 6px;
  border-radius: 999px;
  box-shadow: 0 8px 20px var(--shadow);
  margin-bottom: 20px;
  position: relative;
  z-index: 2;
}
.mode-btn {
  font-family: "Baloo 2", sans-serif;
  font-weight: 700;
  font-size: 15px;
  border: none;
  background: transparent;
  color: var(--plum-soft);
  padding: 10px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.mode-btn.active {
  background: linear-gradient(135deg, var(--pink-deep), var(--grape));
  color: var(--white);
  box-shadow: 0 6px 14px rgba(255, 111, 165, 0.45);
  transform: translateY(-1px);
}

/* ---------- 主卡片 ---------- */
.card {
  background: var(--white);
  border-radius: 32px;
  padding: 22px 20px 26px;
  box-shadow: 0 16px 36px var(--shadow);
  width: min(420px, 94vw);
  position: relative;
  z-index: 1;
  border: 4px solid #fff;
  outline: 3px dashed #ffe1f0;
  outline-offset: -12px;
}

/* ---------- 题目 / 提示条 ---------- */
.prompt-bubble {
  background: var(--sun);
  border-radius: 20px;
  padding: 12px 16px;
  text-align: center;
  font-family: "Baloo 2", sans-serif;
  font-weight: 700;
  color: var(--plum);
  margin-bottom: 16px;
  box-shadow: 0 6px 0 var(--sun-deep);
  position: relative;
  font-size: clamp(15px, 4vw, 19px);
}
.prompt-bubble .big-time {
  font-size: clamp(28px, 8vw, 38px);
  display: block;
  margin-top: 2px;
  color: var(--pink-deep);
}

/* ---------- 时钟容器 ---------- */
.clock-wrap {
  display: flex;
  justify-content: center;
  margin: 6px auto 14px;
  touch-action: none;
}
.clock-svg {
  width: min(320px, 78vw);
  height: min(320px, 78vw);
  touch-action: none;
  user-select: none;
}
.hand {
  cursor: grab;
}
.hand:active {
  cursor: grabbing;
}
.hand-hit {
  fill: transparent;
  stroke: transparent;
  stroke-width: 26;
}

/* ---------- 数字读出 ---------- */
.digital-display {
  font-family: "Baloo 2", sans-serif;
  font-weight: 800;
  font-size: clamp(30px, 8vw, 40px);
  text-align: center;
  color: var(--grape);
  background: var(--lavender);
  border-radius: 18px;
  padding: 8px 10px;
  margin: 4px 0 16px;
  letter-spacing: 2px;
  box-shadow: inset 0 0 0 3px #fff, 0 4px 0 #cbb4ff;
}
.digital-display .colon {
  animation: blink 1.4s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0.25; } }

/* ---------- 按钮组 ---------- */
.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 6px;
}
.btn {
  font-family: "Baloo 2", sans-serif;
  font-weight: 700;
  font-size: 16px;
  border: none;
  border-radius: 999px;
  padding: 12px 22px;
  cursor: pointer;
  color: var(--white);
  box-shadow: 0 6px 0 rgba(0,0,0,0.12);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.12);
}
.btn.check { background: linear-gradient(135deg, var(--mint), #4fd39a); }
.btn.next { background: linear-gradient(135deg, var(--sky), #4bb8f0); }
.btn.random { background: linear-gradient(135deg, var(--grape), #9161e8); }
.btn.reset { background: linear-gradient(135deg, #ffb0c9, var(--pink-deep)); }

/* ---------- 反馈 ---------- */
.feedback {
  text-align: center;
  font-family: "Baloo 2", sans-serif;
  font-weight: 800;
  font-size: 18px;
  margin-top: 14px;
  min-height: 30px;
  border-radius: 14px;
  padding: 8px;
  transition: all 0.2s ease;
}
.feedback.correct {
  color: #1f9d63;
  background: #e3fbef;
}
.feedback.wrong {
  color: #e8548a;
  background: #ffe9f1;
}
.feedback.empty { visibility: hidden; }

.stars {
  text-align: center;
  margin-top: 6px;
  font-size: 20px;
  color: var(--sun-deep);
  font-family: "Baloo 2", sans-serif;
  font-weight: 700;
}

.footer-hint {
  margin-top: 18px;
  text-align: center;
  color: var(--plum-soft);
  font-size: 12.5px;
  font-weight: 700;
  max-width: 360px;
}

@media (max-width: 380px) {
  .card { padding: 18px 12px 20px; }
}

</style>
</head>
<body>
<div id="app"></div>
<script>
// Clock.js —— 糖果风格可拖拽圆形时钟组件
// 支持触摸/鼠标拖动时针、分针、秒针，并维护三者之间的进位/联动关系。

const NUM_COLORS = [
  "#ff6fa5", "#ffb703", "#79e6bd", "#8fd8ff",
  "#b497f5", "#ff8fab", "#4bb8f0", "#4fd39a",
  "#f7a600", "#c084fc", "#ff9770", "#5ed3b8",
];

const CENTER = 150;
const FACE_R = 138;

function polar(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

class Clock {
  /**
   * @param {HTMLElement} container
   * @param {Object} opts
   * @param {{hour:number,minute:number,second:number}} [opts.initial]
   * @param {{hour:boolean,minute:boolean,second:boolean}} [opts.interactive]
   * @param {boolean} [opts.showSecond]
   * @param {(time:{hour:number,minute:number,second:number}, source:string)=>void} [opts.onChange]
   */
  constructor(container, opts = {}) {
    this.container = container;
    this.time = Object.assign({ hour: 3, minute: 0, second: 0 }, opts.initial);
    this.interactive = Object.assign(
      { hour: true, minute: true, second: true },
      opts.interactive
    );
    this.showSecond = opts.showSecond !== false;
    this.onChange = opts.onChange || (() => {});
    this.dragging = null; // 'hour' | 'minute' | 'second' | null

    this._buildDom();
    this._bindEvents();
    this.render();
  }

  // ---------- 对外 API ----------
  setTime(h, m, s = this.time.second) {
    this.time = {
      hour: ((h % 12) + 12) % 12 || 12,
      minute: ((m % 60) + 60) % 60,
      second: ((s % 60) + 60) % 60,
    };
    this.render();
  }

  getTime() {
    return { ...this.time };
  }

  setInteractive(map) {
    Object.assign(this.interactive, map);
    this._updateCursors();
  }

  setShowSecond(show) {
    this.showSecond = show;
    this.secondGroup.style.display = show ? "" : "none";
  }

  randomize({ minuteStep = 5 } = {}) {
    const h = 1 + Math.floor(Math.random() * 12);
    const steps = 60 / minuteStep;
    const m = Math.floor(Math.random() * steps) * minuteStep;
    this.setTime(h, m, 0);
    return this.getTime();
  }

  destroy() {
    this.svg.removeEventListener("pointerdown", this._onPointerDown);
    window.removeEventListener("pointermove", this._onPointerMove);
    window.removeEventListener("pointerup", this._onPointerUp);
    this.container.innerHTML = "";
  }

  // ---------- 内部：构建 DOM ----------
  _buildDom() {
    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 300 300");
    svg.setAttribute("class", "clock-svg");
    this.svg = svg;

    // 表盘底
    const defs = document.createElementNS(svgNS, "defs");
    defs.innerHTML = `
      <radialGradient id="faceGrad" cx="35%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="75%" stop-color="#fff9fc"/>
        <stop offset="100%" stop-color="#ffe9f4"/>
      </radialGradient>
      <linearGradient id="hourGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff8fb3"/>
        <stop offset="100%" stop-color="#ff5f96"/>
      </linearGradient>
      <linearGradient id="minGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c6a6ff"/>
        <stop offset="100%" stop-color="#9b6bf0"/>
      </linearGradient>
    `;
    svg.appendChild(defs);

    svg.appendChild(this._el("circle", { cx: CENTER, cy: CENTER, r: FACE_R + 8, fill: "#fff", opacity: "0.6" }));
    svg.appendChild(this._el("circle", { cx: CENTER, cy: CENTER, r: FACE_R, fill: "url(#faceGrad)", stroke: "#ffd3e8", "stroke-width": 6 }));
    svg.appendChild(this._el("circle", { cx: CENTER, cy: CENTER, r: FACE_R - 14, fill: "none", stroke: "#ffe1f0", "stroke-width": 2, "stroke-dasharray": "4 8" }));

    // 分钟刻度 + 小时刻度 + 数字
    const ticks = document.createElementNS(svgNS, "g");
    for (let i = 0; i < 60; i++) {
      const angle = i * 6;
      const isHour = i % 5 === 0;
      const p1 = polar(CENTER, CENTER, FACE_R - 10, angle);
      const p2 = polar(CENTER, CENTER, FACE_R - (isHour ? 24 : 16), angle);
      ticks.appendChild(
        this._el("line", {
          x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
          stroke: isHour ? "#ffb0cf" : "#ffe1ee",
          "stroke-width": isHour ? 4 : 2,
          "stroke-linecap": "round",
        })
      );
    }
    svg.appendChild(ticks);

    const numbers = document.createElementNS(svgNS, "g");
    for (let n = 1; n <= 12; n++) {
      const angle = n * 30;
      const p = polar(CENTER, CENTER, FACE_R - 40, angle);
      const t = this._el("text", {
        x: p.x, y: p.y, "text-anchor": "middle", "dominant-baseline": "central",
        "font-family": "Baloo 2, sans-serif", "font-weight": "800",
        "font-size": "30", fill: NUM_COLORS[n - 1],
      });
      t.textContent = String(n);
      numbers.appendChild(t);
    }
    svg.appendChild(numbers);

    // 中心可爱笑脸（装饰）
    const face = document.createElementNS(svgNS, "g");
    face.innerHTML = `
      <circle cx="132" cy="146" r="4.5" fill="#4a2e5c"/>
      <circle cx="168" cy="146" r="4.5" fill="#4a2e5c"/>
      <path d="M138 160 Q150 170 162 160" stroke="#4a2e5c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="122" cy="156" r="6" fill="#ffb0cf" opacity="0.7"/>
      <circle cx="178" cy="156" r="6" fill="#ffb0cf" opacity="0.7"/>
    `;
    svg.appendChild(face);

    // 指针
    this.hourGroup = this._buildHand({ length: 62, width: 11, color: "url(#hourGrad)", type: "hour" });
    this.minuteGroup = this._buildHand({ length: 96, width: 7.5, color: "url(#minGrad)", type: "minute" });
    this.secondGroup = this._buildHand({ length: 112, width: 3, color: "#4bb8f0", type: "second", tail: 22 });
    svg.appendChild(this.hourGroup);
    svg.appendChild(this.minuteGroup);
    svg.appendChild(this.secondGroup);

    // 中心圆钉
    svg.appendChild(this._el("circle", { cx: CENTER, cy: CENTER, r: 10, fill: "#ffe066", stroke: "#4a2e5c", "stroke-width": 2 }));
    svg.appendChild(this._el("circle", { cx: 147, cy: 147, r: 2.6, fill: "#fff", opacity: "0.9" }));

    this.container.innerHTML = "";
    this.container.appendChild(svg);
    this._updateCursors();
  }

  _buildHand({ length, width, color, type, tail = 0 }) {
    const svgNS = "http://www.w3.org/2000/svg";
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", `hand ${type}-hand`);
    g.dataset.hand = type;

    const visible = this._el("line", {
      x1: CENTER, y1: CENTER + tail, x2: CENTER, y2: CENTER - length,
      stroke: color, "stroke-width": width, "stroke-linecap": "round",
    });
    const hit = this._el("line", {
      x1: CENTER, y1: CENTER, x2: CENTER, y2: CENTER - length,
      class: "hand-hit",
    });
    g.appendChild(visible);
    g.appendChild(hit);
    return g;
  }

  _el(tag, attrs) {
    const svgNS = "http://www.w3.org/2000/svg";
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  _updateCursors() {
    [
      [this.hourGroup, "hour"],
      [this.minuteGroup, "minute"],
      [this.secondGroup, "second"],
    ].forEach(([g, key]) => {
      g.style.cursor = this.interactive[key] ? "grab" : "default";
      g.style.pointerEvents = this.interactive[key] ? "auto" : "none";
    });
  }

  // ---------- 渲染 ----------
  render() {
    const { hour, minute, second } = this.time;
    const hourAngle = ((hour % 12) + minute / 60 + second / 3600) * 30;
    const minuteAngle = (minute + second / 60) * 6;
    const secondAngle = second * 6;

    this.hourGroup.setAttribute("transform", `rotate(${hourAngle} ${CENTER} ${CENTER})`);
    this.minuteGroup.setAttribute("transform", `rotate(${minuteAngle} ${CENTER} ${CENTER})`);
    this.secondGroup.setAttribute("transform", `rotate(${secondAngle} ${CENTER} ${CENTER})`);
  }

  // ---------- 交互：拖拽 ----------
  _bindEvents() {
    this._onPointerDown = (e) => {
      const handEl = e.target.closest(".hand");
      if (!handEl) return;
      const type = handEl.dataset.hand;
      if (!this.interactive[type]) return;
      this.dragging = type;
      handEl.style.cursor = "grabbing";
      this.svg.setPointerCapture?.(e.pointerId);
      e.preventDefault();
      this._applyDrag(e);
    };
    this._onPointerMove = (e) => {
      if (!this.dragging) return;
      e.preventDefault();
      this._applyDrag(e);
    };
    this._onPointerUp = () => {
      if (!this.dragging) return;
      const g = { hour: this.hourGroup, minute: this.minuteGroup, second: this.secondGroup }[this.dragging];
      if (g) g.style.cursor = "grab";
      this.dragging = null;
    };

    this.svg.addEventListener("pointerdown", this._onPointerDown);
    window.addEventListener("pointermove", this._onPointerMove, { passive: false });
    window.addEventListener("pointerup", this._onPointerUp);
    window.addEventListener("pointercancel", this._onPointerUp);
  }

  _angleFromEvent(e) {
    const rect = this.svg.getBoundingClientRect();
    const scaleX = 300 / rect.width;
    const scaleY = 300 / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;
    const dx = x - CENTER;
    const dy = y - CENTER;
    let angle = (Math.atan2(dx, -dy) * 180) / Math.PI;
    if (angle < 0) angle += 360;
    return angle;
  }

  _applyDrag(e) {
    const angle = this._angleFromEvent(e);
    const prev = { ...this.time };

    if (this.dragging === "second") {
      const newSecond = Math.round(angle / 6) % 60;
      let diff = newSecond - prev.second;
      // 处理跨越 60/0 的进位到「分」
      let minute = prev.minute;
      let hour = prev.hour;
      if (diff < -30) {
        minute += 1;
      } else if (diff > 30) {
        minute -= 1;
      }
      if (minute >= 60) { minute -= 60; hour = (hour % 12) + 1; }
      if (minute < 0) { minute += 60; hour = ((hour - 2 + 12) % 12) + 1; }
      this.time = { hour, minute, second: newSecond };
    } else if (this.dragging === "minute") {
      // 吸附到 5 分钟刻度（表盘上每个数字之间），符合儿童认表教学习惯
      const newMinute = (Math.round(angle / 30) * 5) % 60;
      let diff = newMinute - prev.minute;
      let hour = prev.hour;
      if (diff < -30) {
        hour = (hour % 12) + 1; // 分针从59走向0，进一小时
      } else if (diff > 30) {
        hour = ((hour - 2 + 12) % 12) + 1; // 分针从0倒退到59，退一小时
      }
      this.time = { hour, minute: newMinute, second: prev.second };
    } else if (this.dragging === "hour") {
      // 时针独立拖动时，按最近的整点吸附，分/秒保持不变，
      // 便于孩子明确「时针指向哪个数字」。
      let contHour = angle / 30;
      let newHour = Math.round(contHour) % 12;
      if (newHour === 0) newHour = 12;
      this.time = { hour: newHour, minute: prev.minute, second: prev.second };
    }

    this.render();
    this.onChange(this.getTime(), this.dragging);
  }
}



const app = document.getElementById("app");

// ---------- 背景装饰（云朵 / 星星 / 棒棒糖）----------
const decorations = [
  { emoji: "☁️", top: "6%", left: "6%", size: 46, cls: "slow" },
  { emoji: "⭐", top: "14%", left: "86%", size: 30, cls: "" },
  { emoji: "🍬", top: "78%", left: "8%", size: 34, cls: "rev" },
  { emoji: "🍭", top: "70%", left: "88%", size: 40, cls: "slow rev" },
  { emoji: "☁️", top: "88%", left: "50%", size: 38, cls: "" },
  { emoji: "✨", top: "4%", left: "42%", size: 22, cls: "rev" },
];
decorations.forEach((d) => {
  const el = document.createElement("div");
  el.className = `deco ${d.cls}`;
  el.style.top = d.top;
  el.style.left = d.left;
  el.style.fontSize = d.size + "px";
  el.textContent = d.emoji;
  document.body.appendChild(el);
});

// ---------- 页面骨架 ----------
app.innerHTML = `
  <div class="title">🕐 糖果时间乐园</div>
  <div class="subtitle">拖一拖指针，认识时钟啦！</div>

  <div class="mode-switch">
    <button class="mode-btn" data-mode="challenge">🎯 认表挑战</button>
    <button class="mode-btn" data-mode="free">🎨 自由拨表</button>
  </div>

  <div class="card">
    <div class="prompt-bubble" id="prompt"></div>
    <div class="clock-wrap" id="clockWrap"></div>
    <div class="digital-display" id="digital">--<span class="colon">:</span>--</div>
    <div class="actions" id="actions"></div>
    <div class="feedback empty" id="feedback"></div>
    <div class="stars" id="stars"></div>
  </div>

  <div class="footer-hint">💡 小提示：用手指或鼠标拖动时针、分针（自由模式还能拖秒针）就可以改变时间哦～</div>
`;

const promptEl = document.getElementById("prompt");
const digitalEl = document.getElementById("digital");
const actionsEl = document.getElementById("actions");
const feedbackEl = document.getElementById("feedback");
const starsEl = document.getElementById("stars");
const clockWrap = document.getElementById("clockWrap");
const modeBtns = [...document.querySelectorAll(".mode-btn")];

// ---------- 中文读法辅助 ----------
const CN_NUM = ["零","一","二","三","四","五","六","七","八","九","十","十一","十二",
  "十三","十四","十五","十六","十七","十八","十九","二十","二十一","二十二","二十三","二十四",
  "二十五","二十六","二十七","二十八","二十九","三十","三十一","三十二","三十三","三十四","三十五",
  "三十六","三十七","三十八","三十九","四十","四十一","四十二","四十三","四十四","四十五","四十六",
  "四十七","四十八","四十九","五十","五十一","五十二","五十三","五十四","五十五","五十六","五十七",
  "五十八","五十九"];

function pad2(n) {
  return String(n).padStart(2, "0");
}

function readTimeCN(h, m) {
  if (m === 0) return `${CN_NUM[h]}点整`;
  return `${CN_NUM[h]}点${CN_NUM[m]}分`;
}

function updateDigital(h, m, s) {
  digitalEl.innerHTML = `${pad2(h)}<span class="colon">:</span>${pad2(m)}${
    s !== undefined ? `<span class="colon">:</span>${pad2(s)}` : ""
  }`;
}

// ---------- 时钟实例 ----------
const clock = new Clock(clockWrap, {
  initial: { hour: 12, minute: 0, second: 0 },
  interactive: { hour: true, minute: true, second: true },
  showSecond: true,
  onChange: (t) => {
    updateDigital(t.hour === 12 ? 12 : t.hour, t.minute, mode === "free" ? t.second : undefined);
    if (mode === "challenge") clearFeedback();
  },
});

// ---------- 状态 ----------
let mode = "challenge";
let target = { hour: 3, minute: 0 };
let score = 0;
let asked = 0;

function clearFeedback() {
  feedbackEl.className = "feedback empty";
  feedbackEl.textContent = "";
}

function setFeedback(text, type) {
  feedbackEl.className = `feedback ${type}`;
  feedbackEl.textContent = text;
}

function updateStars() {
  const full = Math.min(score, 8);
  starsEl.textContent = score === 0 ? "" : "⭐".repeat(full) + (score > 8 ? ` x${score}` : "");
}

// ---------- 挑战模式 ----------
function newChallenge() {
  const h = 1 + Math.floor(Math.random() * 12);
  const m = Math.floor(Math.random() * 12) * 5;
  target = { hour: h, minute: m };
  asked += 1;

  // 起始指针放到一个和答案不同的位置，让孩子动手摆
  let startH = h;
  let startM = m;
  while (startH === h && startM === m) {
    startH = 1 + Math.floor(Math.random() * 12);
    startM = Math.floor(Math.random() * 12) * 5;
  }
  clock.setInteractive({ hour: true, minute: true, second: false });
  clock.setShowSecond(false);
  clock.setTime(startH, startM, 0);
  updateDigital(clock.getTime().hour, clock.getTime().minute);

  promptEl.innerHTML = `第 ${asked} 题：请把指针拨到 👇<span class="big-time">${pad2(h)}:${pad2(m)}</span>${readTimeCN(h, m)}`;
  clearFeedback();
}

function checkChallenge() {
  const t = clock.getTime();
  const hourOk = t.hour === target.hour;
  const minuteOk = t.minute === target.minute;
  if (hourOk && minuteOk) {
    score += 1;
    updateStars();
    setFeedback("🎉 太棒了，摆对啦！", "correct");
    setTimeout(newChallenge, 1100);
  } else if (!hourOk && !minuteOk) {
    setFeedback("再看看，时针和分针都要挪一挪哦～", "wrong");
  } else if (!hourOk) {
    setFeedback("分针对啦！时针还要再调一调～", "wrong");
  } else {
    setFeedback("时针对啦！分针还要再调一调～", "wrong");
  }
}

function renderChallengeActions() {
  actionsEl.innerHTML = `
    <button class="btn check" id="btnCheck">✅ 检查一下</button>
    <button class="btn next" id="btnNext">🔄 换一题</button>
  `;
  document.getElementById("btnCheck").onclick = checkChallenge;
  document.getElementById("btnNext").onclick = newChallenge;
}

// ---------- 自由模式 ----------
function renderFreeActions() {
  actionsEl.innerHTML = `
    <button class="btn random" id="btnRandom">🎲 随机时间</button>
    <button class="btn reset" id="btnReset">🏠 回到12点</button>
  `;
  document.getElementById("btnRandom").onclick = () => {
    const h = 1 + Math.floor(Math.random() * 12);
    const m = Math.floor(Math.random() * 60);
    const s = Math.floor(Math.random() * 60);
    clock.setTime(h, m, s);
    updateDigital(...Object.values(clock.getTime()));
  };
  document.getElementById("btnReset").onclick = () => {
    clock.setTime(12, 0, 0);
    updateDigital(12, 0, 0);
  };
}

function enterFree() {
  mode = "free";
  clock.setInteractive({ hour: true, minute: true, second: true });
  clock.setShowSecond(true);
  const t = clock.getTime();
  updateDigital(t.hour, t.minute, t.second);
  promptEl.innerHTML = `自由拨表模式 🎨<br/>拖动三根指针，看看时间会怎么变化！`;
  clearFeedback();
  starsEl.textContent = "";
  renderFreeActions();
}

function enterChallenge() {
  mode = "challenge";
  score = 0;
  asked = 0;
  updateStars();
  renderChallengeActions();
  newChallenge();
}

modeBtns.forEach((btn) => {
  btn.addEventListener("click", () => {
    modeBtns.forEach((b) => b.classList.toggle("active", b === btn));
    if (btn.dataset.mode === "challenge") enterChallenge();
    else enterFree();
  });
});

// 默认进入挑战模式
modeBtns[0].classList.add("active");
enterChallenge();

</script>
