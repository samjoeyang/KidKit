<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>识典古籍 · 史料检索</title>
<style>
  :root {
    --paper: #faf6ee;
    --paper-deep: #f2ebdd;
    --ink: #2f2a24;
    --ink-soft: #6f675c;
    --cinnabar: #a03b2e;
    --cinnabar-soft: #c25b4c;
    --gold: #b98a3c;
    --border: #e3d9c6;
    --card: #fffdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    background: var(--paper);
    background-image: radial-gradient(circle at 20% 10%, rgba(185,138,60,.06), transparent 40%),
                      radial-gradient(circle at 85% 80%, rgba(160,59,46,.05), transparent 45%);
    color: var(--ink);
    min-height: 100vh;
  }
  header { text-align: center; padding: 44px 16px 20px; }
  header .seal {
    display:inline-block; background: var(--cinnabar); color:#fff;
    font-size: 13px; letter-spacing: 6px; padding: 6px 10px 6px 16px;
    border-radius: 4px; margin-bottom: 14px;
  }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: 10px; }
  h1 small { display:block; font-size: 13px; color: var(--ink-soft); letter-spacing: 4px; margin-top: 8px; font-weight: 400;}
  .searchbar {
    display:flex; justify-content:center; gap:10px; margin: 26px auto 8px; max-width: 640px; padding: 0 16px;
  }
  .searchbar input {
    flex:1; font: inherit; font-size: 17px; padding: 12px 18px;
    border: 1.5px solid var(--border); border-radius: 8px; background: var(--card);
    color: var(--ink); outline: none; transition: border-color .2s;
  }
  .searchbar input:focus { border-color: var(--cinnabar); }
  .searchbar button {
    font: inherit; font-size: 16px; letter-spacing: 4px; padding: 12px 26px 12px 30px;
    background: var(--cinnabar); color: #fff; border: none; border-radius: 8px; cursor: pointer;
    transition: background .2s;
  }
  .searchbar button:hover { background: var(--cinnabar-soft); }
  .hint { text-align:center; color: var(--ink-soft); font-size: 13px; }
  .hint a { color: var(--cinnabar); text-decoration: none; }
  .examples { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin: 14px 16px 0; }
  .examples button {
    font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--paper-deep); color: var(--ink-soft); cursor:pointer;
    transition: all .2s;
  }
  .examples button:hover { border-color: var(--cinnabar); color: var(--cinnabar); }
  main { max-width: 860px; margin: 30px auto 60px; padding: 0 16px; }
  .status { text-align:center; color: var(--ink-soft); padding: 30px 0; }
  .status .err { color: var(--cinnabar); }
  .meta {
    display:flex; flex-wrap:wrap; align-items:baseline; gap:12px;
    border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 18px;
  }
  .meta b { font-size: 16px; }
  .meta .total { color: var(--cinnabar); }
  .corrected { color: var(--gold); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 22px; margin-bottom: 14px; position: relative;
    box-shadow: 0 1px 3px rgba(80,60,30,.05); transition: box-shadow .2s, transform .2s;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(80,60,30,.12); transform: translateY(-1px); }
  .card .bookline { display:flex; align-items:baseline; flex-wrap:wrap; gap: 8px; margin-bottom: 8px; }
  .card .bookname { font-size: 18px; font-weight: 700; color: var(--ink); }
  .card .authors { color: var(--ink-soft); font-size: 13px; }
  .card .edition {
    font-size: 12px; color: var(--gold); border: 1px solid #e8d9b8; border-radius: 4px; padding: 1px 7px;
  }
  .card .chapter { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  .card .chapter::before { content: "卷"; color: var(--cinnabar); margin-right: 6px; font-weight: 700;}
  .card .text { font-size: 16px; line-height: 2; letter-spacing: .5px; }
  .card .text mark {
    background: linear-gradient(transparent 55%, rgba(192,91,76,.28) 55%);
    color: var(--cinnabar); font-weight: 700; padding: 0 1px;
  }
  .card .foot { margin-top: 10px; display:flex; justify-content: space-between; align-items:center; }
  .card .foot a { color: var(--cinnabar); font-size: 13px; text-decoration: none; }
  .card .foot a:hover { text-decoration: underline; }
  .card .match { font-size: 12px; color: #8a7a4e; }
  .reco { margin-top: 34px; }
  .reco h2 { font-size: 18px; letter-spacing: 4px; margin-bottom: 14px; color: var(--ink); }
  .reco h2::before { content: "◈ "; color: var(--cinnabar); }
  .reco-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px,1fr)); gap: 12px; }
  .reco a {
    display:block; background: var(--card); border:1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; text-decoration:none; color: var(--ink); transition: all .2s;
  }
  .reco a:hover { border-color: var(--cinnabar); }
  .reco .rn { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .reco .ra { font-size: 12px; color: var(--ink-soft); }
  .banner {
    max-width: 860px; margin: 18px auto 0; padding: 12px 18px; border-radius: 8px;
    background: #fdf3e3; border: 1px solid #e8d3ac; color: #7a5a20; font-size: 14px; line-height: 1.8;
    display:none;
  }
  .banner.show { display:block; }
  .banner a { color: var(--cinnabar); font-weight: 700; }
  .banner code { background:#fff; padding:1px 6px; border-radius:4px; font-family: ui-monospace, monospace; font-size:13px;}
  footer { text-align:center; color: var(--ink-soft); font-size: 12px; padding: 30px 16px 40px; line-height: 1.8; }
  @media (max-width: 600px) { h1 { font-size: 26px; letter-spacing: 6px; } }
</style>
</head>
<body>
<header>
  <div class="seal">識典</div>
  <h1>史 料 檢 索<small>数据来源：识典古籍 shidianguji.com · 免费古籍平台</small></h1>
</header>

<div class="searchbar">
  <input id="q" type="text" placeholder="输入关键词，如：史记、資治通鑑、貞觀、王安石…" autofocus>
  <button onclick="doSearch()">檢索</button>
</div>
<div class="examples" id="examples"></div>
<p class="hint">支持繁简混合检索 · 精确匹配可在关键词外加 <a href="javascript:example('&quot;貞觀之治&quot;')">英文引号</a></p>

<div class="banner" id="banner"></div>

<main id="main">
  <div class="status">以词索史，遍检千帙。请输入关键词开始。</div>
</main>

<footer>
  本工具为个人检索辅助，正文数据实时来自「识典古籍」公开搜索页，版权归原整理者与平台所有。<br>
  点击书目卡片可跳转识典古籍官网阅读全文（免费注册即可）。
</footer>

<script>
const EXAMPLES = ['史记', '資治通鑑', '漢書', '貞觀政要', '王安石', '論語', '水經注', '明史'];
const examplesEl = document.getElementById('examples');
EXAMPLES.forEach(w => {
  const b = document.createElement('button');
  b.textContent = w;
  b.onclick = () => example(w);
  examplesEl.appendChild(b);
});

function example(w) { document.getElementById('q').value = w; doSearch(); }

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

let lastQuery = '';
let PROXY_OK = false; // 后端代理是否可用（静态打开时为 false）

const OFFICIAL = 'https://www.shidianguji.com';

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function showBanner(html) {
  const b = document.getElementById('banner');
  b.innerHTML = html;
  b.classList.add('show');
}

function officialSearch(q) {
  window.open(OFFICIAL + '/search/' + encodeURIComponent(q), '_blank');
}

// 启动时探测后端代理是否可用
async function probeProxy() {
  try {
    const r = await fetch('/api/health', { cache: 'no-store' });
    if (!r.ok) throw new Error('no proxy');
    const d = JSON.parse(await r.text());
    if (d && d.ok) { PROXY_OK = true; return; }
    throw new Error('bad health');
  } catch (e) {
    PROXY_OK = false;
    const here = location.protocol === 'file:' ? '本地文件' : location.origin;
    showBanner(
      '⚠️ 当前页面（' + esc(here) + '）没有连接到检索后端，只能作为「跳转官网」使用。<br>'
      + '请通过本地服务地址打开本工具：<a href="http://localhost:4173" target="_blank">http://localhost:4173</a>'
      + '（在工具目录下执行 <code>node server.js</code> 启动）。<br>'
      + '仍可在此输入关键词，Enter 将直接在识典古籍官网检索。'
    );
  }
}

async function apiSearch(q) {
  const r = await fetch('/api/search?q=' + encodeURIComponent(q), { cache: 'no-store' });
  const raw = await r.text();
  if (!raw) throw new Error('EMPTY_RESPONSE');
  let d;
  try {
    d = JSON.parse(raw);
  } catch {
    throw new Error('EMPTY_RESPONSE');
  }
  return d;
}

function highlight(text, words) {
  let html = esc(text);
  for (const w of words) {
    if (!w) continue;
    const parts = html.split(esc(w));
    html = parts.join('<mark>' + esc(w) + '</mark>');
  }
  return html;
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  lastQuery = q;
  const main = document.getElementById('main');

  if (!PROXY_OK) {
    showBanner(
      '静态模式：已在新标签页打开识典古籍官网检索「' + esc(q) + '」。'
      + '要使用本工具的整合结果视图，请访问 <a href="http://localhost:4173" target="_blank">http://localhost:4173</a>。'
    );
    officialSearch(q);
    return;
  }

  main.innerHTML = '<div class="status">正在翻检书海……</div>';
  window.scrollTo({ top: 0 });
  try {
    const d = await apiSearch(q);
    if (!d.ok) {
      main.innerHTML = '<div class="status"><span class="err">检索失败：</span>' + esc(d.reason || '未知原因')
        + '<br>可稍后重试，或直接前往 <a href="' + (d.officialUrl || OFFICIAL) + '" target="_blank" style="color:var(--cinnabar)">识典古籍官网</a></div>';
      return;
    }
    render(d);
  } catch (e) {
    if (String(e.message) === 'EMPTY_RESPONSE') {
      // 后端不在了（多为静态副本打开），降级为官网检索
      PROXY_OK = false;
      showBanner(
        '⚠️ 未检测到检索后端，已切换为「跳转官网」模式。<br>'
        + '请改用本地服务地址打开：<a href="http://localhost:4173" target="_blank">http://localhost:4173</a>'
      );
      officialSearch(q);
      main.innerHTML = '<div class="status">已在新标签页打开识典古籍官网检索「' + esc(q) + '」。<br>'
        + '需要整合视图请访问 <a href="http://localhost:4173" target="_blank" style="color:var(--cinnabar)">http://localhost:4173</a>。</div>';
      return;
    }
    main.innerHTML = '<div class="status"><span class="err">网络异常：</span>' + esc(String(e.message || e))
      + '<br>请确认本地服务仍在运行，或 <a href="' + OFFICIAL + '/search/' + encodeURIComponent(q) + '" target="_blank" style="color:var(--cinnabar)">前往官网检索</a>。</div>';
  }
}

// 启动：探测后端 + 支持 ?q=关键词 直接检索（便于分享链接）
(async function boot() {
  const preset = new URLSearchParams(location.search).get('q');
  if (preset) document.getElementById('q').value = preset;
  await probeProxy();
  if (preset) doSearch();
})();

function render(d) {
  const main = document.getElementById('main');
  const words = (d.segments || []).concat(d.phrases || []);
  let html = '';

  html += '<div class="meta"><b>「' + esc(d.query) + '」</b>';
  if (d.correctedText && d.correctedText !== d.query) {
    html += '<span class="corrected">已为您显示：' + esc(d.correctedText) + '</span>';
  }
  html += '<span>约 <span class="total">' + d.total + '</span> 条出处</span>';
  html += '<span style="margin-left:auto"><a class="match" href="' + d.officialUrl + '" target="_blank">在官网查看全部 →</a></span></div>';

  if (!d.paragraphs.length) {
    html += '<div class="status">未检得条目，可尝试更换关键词或使用繁体字。</div>';
  }

  d.paragraphs.forEach((p, i) => {
    html += '<div class="card">'
      + '<div class="bookline">'
      + '<span class="bookname">' + esc(p.bookName) + '</span>'
      + (p.edition ? '<span class="edition">' + esc(p.editionDynasty) + '·' + esc(p.edition) + '</span>' : '')
      + '<span class="authors">' + esc(p.authors.join('；')) + '</span>'
      + (p.perfectMatch ? '<span class="match">✦ 精确匹配</span>' : '')
      + '</div>'
      + (p.chapter ? '<div class="chapter">' + esc(p.chapter) + '</div>' : '')
      + '<div class="text">' + highlight(p.text, words) + '</div>'
      + '<div class="foot"><a href="' + p.url + '" target="_blank">前往原书阅读 →</a>'
      + '<span class="match">出处 ' + (i + 1) + '</span></div>'
      + '</div>';
  });

  if (d.recommends && d.recommends.length) {
    html += '<div class="reco"><h2>相关典籍</h2><div class="reco-grid">';
    d.recommends.forEach(b => {
      html += '<a href="' + b.url + '" target="_blank"><div class="rn">' + esc(b.bookName) + '</div>'
        + '<div class="ra">' + esc(b.authors || '佚名') + '</div></a>';
    });
    html += '</div></div>';
  }

  main.innerHTML = html;
}
</script>
</body>
</html>
